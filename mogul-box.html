<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0b0f;color:#e8e0d4;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit;transition:all .3s ease}
img{max-width:100%;height:auto;display:block}
ul,ol{list-style:none}
button{border:none;background:none;cursor:pointer;font-family:inherit}

:root{
--gold:#d4af37;--gold-light:#f4d03f;--gold-dark:#c27803;
--gold-dim:rgba(212,175,55,.08);--gold-border:rgba(212,175,55,.15);
--bg-primary:#0a0b0f;--bg-secondary:#0d1117;--bg-tertiary:#111827;
--bg-card:rgba(255,255,255,.02);
--text-primary:#e8e0d4;--text-secondary:#b8a99a;--text-muted:#8a7e70;
--text-dim:#6b6358;--text-faint:#4a4339;
--green:#4ade80;--green-dim:rgba(74,222,128,.08);
--blue:#5b9bd5;--orange:#e8943a;--orange-dim:rgba(232,148,58,.08);
--purple:#a78bfa;--purple-dim:rgba(167,139,250,.08);
--cyan:#22d3ee;
--red:#ef4444;
--whatsapp:#25D366;
/* Mogul = gold-on-gold — ultimate tier */
--mogul:var(--gold);--mogul-dim:var(--gold-dim);--mogul-border:rgba(212,175,55,.25);
--mogul-glow:rgba(212,175,55,.4);
--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:20px;--radius-full:50px;
--shadow-sm:0 2px 10px rgba(0,0,0,.2);--shadow-md:0 4px 25px rgba(0,0,0,.3);
--shadow-lg:0 10px 40px rgba(0,0,0,.4);--shadow-gold:0 4px 25px rgba(212,175,55,.3);
--transition:all .3s cubic-bezier(.4,0,.2,1);
--transition-bounce:all .4s cubic-bezier(.175,.885,.32,1.275);
--max-width:1100px;
}

/* ============================================
   NAV (identical structure)
   ============================================ */
.v-nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 20px;background:rgba(10,11,15,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--gold-border)}
.v-nav-inner{max-width:var(--max-width);margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:68px}
.v-nav-brand{display:flex;align-items:center;gap:6px}
.v-nav-logo{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:var(--gold)}
.v-nav-logo-sub{font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;padding:2px 8px;background:var(--gold-dim);border-radius:3px;margin-left:2px}
.v-nav-dot{display:inline-block;width:7px;height:7px;background:var(--gold);border-radius:50%;animation:dotP 2s ease-in-out infinite}
@keyframes dotP{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.v-nav-links{display:flex;align-items:center;gap:25px}
.v-nav-link{font-size:13px;font-weight:500;color:var(--text-muted)}.v-nav-link:hover{color:var(--gold)}
.v-nav-cta{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--bg-primary);font-size:12px;font-weight:700;border-radius:var(--radius-sm);text-transform:uppercase;letter-spacing:1px;transition:var(--transition-bounce)}
.v-nav-cta:hover{transform:translateY(-2px);box-shadow:var(--shadow-gold);color:var(--bg-primary)}
.v-nav-toggle{display:none;flex-direction:column;gap:5px;padding:5px}
.v-nav-toggle span{width:22px;height:2px;background:var(--gold);display:block;transition:var(--transition)}
.v-nav-toggle.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.v-nav-toggle.active span:nth-child(2){opacity:0}
.v-nav-toggle.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.v-mobile-menu{display:none;position:fixed;top:68px;left:0;right:0;background:rgba(10,11,15,.98);backdrop-filter:blur(20px);padding:15px 20px;border-bottom:1px solid var(--gold-border);z-index:999;flex-direction:column;gap:8px}
.v-mobile-menu.active{display:flex}
.v-mobile-menu a{display:block;padding:12px 15px;font-size:14px;color:var(--text-secondary);border-bottom:1px solid rgba(255,255,255,.03)}
.v-mobile-menu a:hover{color:var(--gold);padding-left:20px}

/* BREADCRUMB */
.v-breadcrumb{padding:85px 20px 0;max-width:var(--max-width);margin:0 auto}
.v-breadcrumb-trail{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);flex-wrap:wrap}
.v-breadcrumb-trail a{color:var(--text-muted)}.v-breadcrumb-trail a:hover{color:var(--gold)}
.v-breadcrumb-sep{color:var(--text-faint)}.v-breadcrumb-current{color:var(--gold)}

/* ============================================
   MOGUL HERO — ULTIMATE TIER
   ============================================ */
.m-hero{padding:40px 20px 80px;background:linear-gradient(180deg,var(--bg-primary) 0%,#1a1207 50%,var(--bg-secondary) 100%);position:relative;overflow:hidden}
.m-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 40% 40%,rgba(212,175,55,.1) 0%,transparent 55%),radial-gradient(ellipse at 70% 70%,rgba(212,175,55,.06) 0%,transparent 45%),radial-gradient(ellipse at 20% 80%,rgba(194,120,3,.04) 0%,transparent 40%);pointer-events:none}

/* Gold particle field */
.m-particle{position:absolute;width:3px;height:3px;background:var(--gold);border-radius:50%;pointer-events:none;opacity:0;animation:particleRise linear infinite}
.m-particle:nth-child(1){left:10%;animation-duration:8s;animation-delay:0s}
.m-particle:nth-child(2){left:25%;animation-duration:6s;animation-delay:1s}
.m-particle:nth-child(3){left:40%;animation-duration:9s;animation-delay:2s}
.m-particle:nth-child(4){left:55%;animation-duration:7s;animation-delay:.5s}
.m-particle:nth-child(5){left:70%;animation-duration:8s;animation-delay:1.5s}
.m-particle:nth-child(6){left:85%;animation-duration:6s;animation-delay:3s}
.m-particle:nth-child(7){left:15%;animation-duration:10s;animation-delay:2.5s}
.m-particle:nth-child(8){left:60%;animation-duration:7s;animation-delay:4s}
@keyframes particleRise{0%{bottom:-5%;opacity:0;transform:translateX(0)}20%{opacity:.6}50%{opacity:.3;transform:translateX(20px)}80%{opacity:.1}100%{bottom:105%;opacity:0;transform:translateX(-10px)}}

.m-hero-inner{max-width:var(--max-width);margin:0 auto;display:grid;grid-template-columns:1fr 1.3fr;gap:50px;align-items:center;position:relative;z-index:1}

/* Mogul Visual — Crown Box */
.m-visual{display:flex;justify-content:center;align-items:center}
.m-box-visual{position:relative;width:340px;height:380px}

.m-box-main{width:100%;height:100%;border-radius:var(--radius-xl);background:linear-gradient(160deg,rgba(212,175,55,.15),rgba(212,175,55,.03));border:2px solid var(--mogul-border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(212,175,55,.15),0 10px 50px rgba(0,0,0,.3)}

/* Rotating gold border effect */
.m-box-main::before{content:'';position:absolute;inset:-2px;border-radius:var(--radius-xl);background:conic-gradient(from 0deg,var(--gold),var(--gold-dark),transparent,var(--gold-light),var(--gold),transparent,var(--gold-dark),var(--gold));animation:mogulRotate 6s linear infinite;z-index:-1}
.m-box-main::after{content:'';position:absolute;inset:2px;border-radius:calc(var(--radius-xl) - 2px);background:linear-gradient(160deg,#12100a,#0d0b07);z-index:0}
@keyframes mogulRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.m-box-content{position:relative;z-index:1}
.m-box-crown{font-size:70px;filter:drop-shadow(0 4px 20px rgba(212,175,55,.4));margin-bottom:12px;animation:crownFloat 3s ease-in-out infinite}
@keyframes crownFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.m-box-label{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.m-box-sublabel{font-size:12px;color:rgba(212,175,55,.5);letter-spacing:3px;text-transform:uppercase}

/* Floating elements */
.m-float{position:absolute;font-size:18px;z-index:2;animation:mFloat 4s ease-in-out infinite}
.m-float-1{top:2%;left:-8%;animation-delay:0s}
.m-float-2{top:12%;right:-6%;animation-delay:.4s}
.m-float-3{top:35%;left:-12%;animation-delay:.8s}
.m-float-4{bottom:35%;right:-10%;animation-delay:1.2s}
.m-float-5{bottom:18%;left:-10%;animation-delay:1.6s}
.m-float-6{top:55%;right:-14%;animation-delay:2s}
.m-float-7{bottom:8%;right:-8%;animation-delay:2.4s}
.m-float-8{top:70%;left:-8%;animation-delay:2.8s}
@keyframes mFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.15)}}

.m-box-shadow{position:absolute;bottom:-20px;left:8%;width:84%;height:30px;background:radial-gradient(ellipse,rgba(212,175,55,.2) 0%,transparent 70%);filter:blur(12px)}

/* Mogul Info */
.m-info{max-width:540px}

.m-tier-badge{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(212,175,55,.06));border:1px solid rgba(212,175,55,.4);border-radius:var(--radius-full);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:20px;animation:mogulBadge 3s ease-in-out infinite}
@keyframes mogulBadge{0%,100%{box-shadow:0 0 15px rgba(212,175,55,.15)}50%{box-shadow:0 0 40px rgba(212,175,55,.3)}}

.m-title{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:800;line-height:1.08;margin-bottom:6px;background:linear-gradient(135deg,#d4af37,#f4d03f,#d4af37,#c27803);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.m-tagline{font-size:18px;color:var(--text-muted);margin-bottom:18px;font-style:italic}

.m-desc{font-size:15px;color:var(--text-secondary);line-height:1.8;margin-bottom:20px}
.m-desc strong{color:var(--gold);font-weight:600}

/* Price Block — Premium */
.m-price-block{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
.m-price{font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.m-price-original{font-size:22px;color:var(--text-dim);text-decoration:line-through}
.m-price-save{font-size:12px;font-weight:700;color:var(--green);background:var(--green-dim);padding:4px 14px;border-radius:var(--radius-full)}
.m-price-note{font-size:13px;color:var(--text-dim);margin-bottom:22px}

/* Quick facts */
.m-quick{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.m-quick-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);background:var(--gold-dim);padding:6px 14px;border-radius:var(--radius-full);border:1px solid var(--gold-border)}

/* CTA */
.m-cta-group{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}

.m-btn-order{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:20px 44px;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;border-radius:var(--radius-md);text-transform:uppercase;letter-spacing:1.5px;transition:var(--transition-bounce);position:relative;overflow:hidden;min-width:280px;color:var(--bg-primary);background:linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold),var(--gold-dark));background-size:300% 300%;animation:mogulShift 4s ease infinite;box-shadow:0 4px 35px var(--mogul-glow)}
@keyframes mogulShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.m-btn-order::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transition:left .7s ease}
.m-btn-order:hover::before{left:100%}
.m-btn-order:hover{transform:translateY(-4px);box-shadow:0 10px 50px rgba(212,175,55,.5);color:var(--bg-primary)}

.m-btn-alt{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;background:transparent;color:var(--text-muted);font-size:13px;font-weight:600;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.08);transition:var(--transition)}
.m-btn-alt:hover{border-color:var(--gold-border);color:var(--gold);background:var(--gold-dim)}

.m-note{font-size:12px;color:var(--text-dim);font-style:italic}

/* Guarantee */
.m-guarantee{display:flex;align-items:center;gap:10px;margin-top:18px;padding:16px 20px;background:linear-gradient(135deg,var(--green-dim),rgba(74,222,128,.02));border:1px solid rgba(74,222,128,.15);border-radius:var(--radius-md)}
.m-guarantee-icon{font-size:22px;flex-shrink:0}
.m-guarantee-text{font-size:12px;color:var(--green);font-weight:600;line-height:1.5}

/* ============================================
   SECTIONS
   ============================================ */
.v-section{padding:70px 20px}
.v-section--alt{background:linear-gradient(180deg,var(--bg-secondary),var(--bg-tertiary))}
.v-section--dark{background:linear-gradient(180deg,var(--bg-tertiary),var(--bg-secondary))}
.v-section--end{background:linear-gradient(180deg,var(--bg-secondary),var(--bg-primary))}
.v-section--gold{background:linear-gradient(180deg,#12100a,#0d0b07)}
.v-section-inner{max-width:var(--max-width);margin:0 auto}

.v-label{display:inline-block;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;padding:6px 16px;background:var(--gold-dim);border-radius:4px}
.v-stitle{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:var(--text-primary);margin-bottom:10px;line-height:1.2}
.v-stitle span{color:var(--gold)}
.v-sdesc{font-size:15px;color:var(--text-muted);max-width:600px;line-height:1.7;margin-bottom:30px}

/* ============================================
   INCLUDES GRID
   ============================================ */
.m-includes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.m-include{display:flex;align-items:flex-start;gap:14px;padding:20px;background:var(--bg-card);border:1px solid rgba(255,255,255,.04);border-radius:var(--radius-md);transition:var(--transition)}
.m-include:hover{border-color:var(--gold-border);background:var(--gold-dim);transform:translateX(4px)}
.m-include-icon{font-size:22px;flex-shrink:0;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--gold-dim);border-radius:var(--radius-sm)}
.m-include-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:3px}
.m-include-desc{font-size:12px;color:var(--text-muted);line-height:1.5}
.m-include-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--radius-full);margin-top:4px;letter-spacing:.5px}
.m-tag-mogul{background:linear-gradient(135deg,rgba(212,175,55,.15),rgba(212,175,55,.05));color:var(--gold)}
.m-tag-incl{background:var(--green-dim);color:var(--green)}

/* ============================================
   ALL 8 PLATFORMS
   ============================================ */
.m-platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.m-platform{padding:20px 14px;background:linear-gradient(160deg,rgba(212,175,55,.06),rgba(212,175,55,.01));border:1px solid var(--gold-border);border-radius:var(--radius-md);text-align:center;transition:var(--transition);position:relative}
.m-platform:hover{border-color:rgba(212,175,55,.4);transform:translateY(-4px);box-shadow:0 6px 25px rgba(212,175,55,.1)}
.m-platform::after{content:'✅ INCLUDED';position:absolute;top:8px;right:8px;font-size:8px;font-weight:700;color:var(--green);letter-spacing:.5px}
.m-platform-emoji{font-size:30px;display:block;margin-bottom:8px}
.m-platform-name{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:2px}
.m-platform-desc{font-size:11px;color:var(--text-dim);line-height:1.4}

/* ============================================
   DELIVERABLES
   ============================================ */
.m-deliverables{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.m-deliverable{padding:22px 14px;background:linear-gradient(160deg,rgba(212,175,55,.06),rgba(212,175,55,.01));border:1px solid rgba(212,175,55,.1);border-radius:var(--radius-lg);text-align:center;transition:var(--transition)}
.m-deliverable:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(212,175,55,.12)}
.m-del-num{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:800;color:var(--gold);display:block;margin-bottom:4px}
.m-del-label{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:3px}
.m-del-desc{font-size:11px;color:var(--text-muted);line-height:1.4}

/* ============================================
   MENTORSHIP SECTION — MOGUL EXCLUSIVE
   ============================================ */
.m-mentorship{max-width:800px;margin:30px auto 0;padding:40px 30px;background:linear-gradient(160deg,rgba(212,175,55,.1),rgba(212,175,55,.02));border:2px solid rgba(212,175,55,.25);border-radius:var(--radius-xl);position:relative;overflow:hidden}
.m-mentorship::before{content:'';position:absolute;top:0;right:0;width:300px;height:300px;background:radial-gradient(circle,rgba(212,175,55,.06) 0%,transparent 70%);pointer-events:none}
.m-mentorship-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(212,175,55,.05));border-radius:var(--radius-full);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.m-mentorship-title{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:var(--text-primary);margin-bottom:10px;position:relative;z-index:1}
.m-mentorship-title span{color:var(--gold)}
.m-mentorship-desc{font-size:14px;color:var(--text-muted);line-height:1.7;margin-bottom:22px;position:relative;z-index:1}
.m-mentorship-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:1}
.m-mentorship-item{display:flex;align-items:flex-start;gap:10px;padding:14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:var(--radius-md)}
.m-mentorship-check{color:var(--gold);font-size:14px;flex-shrink:0;margin-top:1px}
.m-mentorship-text{font-size:12px;color:var(--text-secondary);line-height:1.5}
.m-mentorship-text strong{color:var(--gold);font-weight:600}

/* ============================================
   TIMELINE
   ============================================ */
.m-timeline{display:flex;flex-direction:column;gap:0;max-width:650px;margin:30px auto 0}
.m-time-step{display:flex;gap:20px;position:relative;padding-bottom:30px}
.m-time-step:last-child{padding-bottom:0}
.m-time-line{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:40px}
.m-time-dot{width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:0 0 15px rgba(212,175,55,.4);flex-shrink:0;position:relative;z-index:1}
.m-time-connector{width:2px;flex-grow:1;background:linear-gradient(180deg,rgba(212,175,55,.3),rgba(212,175,55,.05))}
.m-time-step:last-child .m-time-connector{display:none}
.m-time-content{padding-top:0}
.m-time-label{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.m-time-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:4px}
.m-time-desc{font-size:13px;color:var(--text-muted);line-height:1.6}

/* ============================================
   ROI
   ============================================ */
.m-roi{max-width:700px;margin:30px auto 0;padding:40px 30px;background:linear-gradient(160deg,rgba(212,175,55,.08),rgba(212,175,55,.02));border:2px solid rgba(212,175,55,.2);border-radius:var(--radius-xl);text-align:center;position:relative;overflow:hidden}
.m-roi::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 30%,rgba(212,175,55,.05) 0%,transparent 60%);pointer-events:none}
.m-roi-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--text-primary);margin-bottom:8px;position:relative;z-index:1}
.m-roi-desc{font-size:13px;color:var(--text-muted);margin-bottom:22px;position:relative;z-index:1}
.m-roi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;position:relative;z-index:1}
.m-roi-item{padding:16px 10px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:var(--radius-md)}
.m-roi-label{font-size:10px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.m-roi-value{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:800}
.m-roi-invest{color:var(--gold)}
.m-roi-m3{color:var(--orange)}
.m-roi-m6{color:var(--green)}
.m-roi-m12{color:#22d3ee}
.m-roi-note{font-size:11px;color:var(--text-dim);margin-top:16px;font-style:italic;position:relative;z-index:1}

/* ============================================
   COMPARISON
   ============================================ */
.m-compare{max-width:850px;margin:30px auto 0;overflow-x:auto}
.m-compare-table{width:100%;border-collapse:collapse;min-width:600px}
.m-compare-table th,.m-compare-table td{padding:13px 14px;text-align:left;font-size:12px;border-bottom:1px solid rgba(255,255,255,.04)}
.m-compare-table th{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--text-primary);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.m-compare-table td{color:var(--text-muted)}
.m-compare-table .feature-name{color:var(--text-secondary);font-weight:500}
.m-col-highlight{background:rgba(212,175,55,.05)}
.m-col-highlight th{color:var(--gold)}
.m-check{color:var(--green);font-weight:700}
.m-x{color:var(--text-faint)}
.m-compare-table tr:hover{background:rgba(255,255,255,.01)}

/* ============================================
   SOCIAL PROOF
   ============================================ */
.m-proof{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.m-proof-card{padding:24px 20px;background:linear-gradient(160deg,rgba(212,175,55,.05),rgba(212,175,55,.01));border:1px solid rgba(212,175,55,.1);border-radius:var(--radius-md);transition:var(--transition)}
.m-proof-card:hover{border-color:rgba(212,175,55,.25);transform:translateY(-3px)}
.m-proof-quote{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:12px;font-style:italic;position:relative;padding-left:16px}
.m-proof-quote::before{content:'\201C';position:absolute;left:0;top:-4px;font-size:24px;color:rgba(212,175,55,.3);font-family:Georgia,serif}
.m-proof-author{display:flex;align-items:center;gap:8px}
.m-proof-flag{font-size:18px}
.m-proof-name{font-size:12px;font-weight:600;color:var(--text-primary)}
.m-proof-detail{font-size:10px;color:var(--text-dim)}

/* ============================================
   FAQ
   ============================================ */
.m-faq-grid{max-width:700px;margin:30px auto 0;display:flex;flex-direction:column;gap:10px}
.m-faq-item{border:1px solid rgba(255,255,255,.04);border-radius:var(--radius-md);overflow:hidden;transition:var(--transition)}
.m-faq-item:hover{border-color:var(--gold-border)}
.m-faq-q{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 20px;cursor:pointer;transition:var(--transition)}
.m-faq-q:hover{background:var(--gold-dim)}
.m-faq-q-text{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:var(--text-primary)}
.m-faq-toggle{font-size:18px;color:var(--gold);transition:transform .3s ease;flex-shrink:0}
.m-faq-item.open .m-faq-toggle{transform:rotate(45deg)}
.m-faq-a{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .4s ease}
.m-faq-item.open .m-faq-a{max-height:350px;padding:0 20px 16px}
.m-faq-a-text{font-size:13px;color:var(--text-muted);line-height:1.7}

/* ============================================
   OTHER TIERS
   ============================================ */
.m-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.m-tier-card{padding:24px 18px;background:var(--bg-card);border:1px solid rgba(255,255,255,.05);border-radius:var(--radius-lg);transition:var(--transition);text-align:center}
.m-tier-card:hover{border-color:var(--gold-border);transform:translateY(-4px);box-shadow:var(--shadow-md)}
.m-tier-name{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:4px}
.m-tier-price{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:800;color:var(--gold);margin-bottom:6px}
.m-tier-desc{font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.5}
.m-tier-cta{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--gold);padding:8px 18px;border:1px solid var(--gold-border);border-radius:var(--radius-sm);transition:var(--transition)}
.m-tier-cta:hover{background:var(--gold-dim);color:var(--gold-light)}

/* ============================================
   QUOTE
   ============================================ */
.v-quote{padding:60px 20px;background:linear-gradient(180deg,var(--bg-tertiary),var(--bg-secondary));text-align:center}
.v-quote-text{max-width:580px;margin:0 auto;font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600;color:var(--gold);line-height:1.5;font-style:italic;position:relative;padding:0 20px}
.v-quote-text::before{content:'\201C';font-size:70px;color:rgba(212,175,55,.12);position:absolute;top:-20px;left:-5px;font-family:Georgia,serif;line-height:1}
.v-quote-author{font-size:13px;color:var(--text-dim);margin-top:14px;font-style:normal;letter-spacing:1px}

/* ============================================
   FINAL CTA
   ============================================ */
.v-final{padding:90px 20px;background:linear-gradient(180deg,#12100a,var(--bg-primary));text-align:center;position:relative;overflow:hidden}
.v-final::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(212,175,55,.08) 0%,transparent 60%);pointer-events:none}
.v-final-inner{max-width:650px;margin:0 auto;position:relative;z-index:1}
.v-final-title{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:800;margin-bottom:12px;line-height:1.2;background:linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.v-final-sub{font-size:16px;color:var(--text-muted);margin-bottom:30px;line-height:1.7}
.v-final-cta-group{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:20px}
.v-final-meta{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;margin-top:16px}
.v-meta{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px}

/* WHATSAPP + FOOTER */
.v-whatsapp{position:fixed;bottom:25px;right:25px;z-index:900;width:56px;height:56px;background:var(--whatsapp);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:white;box-shadow:0 4px 20px rgba(37,211,102,.4);transition:var(--transition-bounce)}
.v-whatsapp:hover{transform:scale(1.1) translateY(-3px);box-shadow:0 8px 30px rgba(37,211,102,.5);color:white}
.v-footer{padding:40px 20px 25px;background:#07080a;border-top:1px solid rgba(212,175,55,.04)}
.v-footer-inner{max-width:var(--max-width);margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.v-footer-left{display:flex;flex-direction:column;gap:4px}
.v-footer-brand{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--gold)}
.v-footer-copy{font-size:11px;color:var(--text-faint)}
.v-footer-links{display:flex;gap:18px;flex-wrap:wrap}
.v-footer-links a{font-size:12px;color:var(--text-dim)}.v-footer-links a:hover{color:var(--gold)}

/* ANIMATIONS */
.v-animate{opacity:0;transform:translateY(25px);transition:opacity .7s ease,transform .7s ease}
.v-animate.visible{opacity:1;transform:translateY(0)}
.v-ad1{transition-delay:.1s}.v-ad2{transition-delay:.2s}.v-ad3{transition-delay:.3s}.v-ad4{transition-delay:.4s}

/* RESPONSIVE */
@media(max-width:1024px){.m-platforms{grid-template-columns:repeat(4,1fr)}.m-deliverables{grid-template-columns:repeat(2,1fr)}.m-proof{grid-template-columns:1fr 1fr}.m-tiers{grid-template-columns:1fr 1fr}.m-roi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.v-nav-links{display:none}.v-nav-toggle{display:flex}.m-hero-inner{grid-template-columns:1fr;text-align:center}.m-info{margin:0 auto}.m-price-block{justify-content:center}.m-quick{justify-content:center}.m-cta-group{justify-content:center}.m-title{font-size:34px}.m-box-visual{width:270px;height:310px}.v-stitle{font-size:24px}.m-includes{grid-template-columns:1fr}.m-platforms{grid-template-columns:repeat(2,1fr)}.m-deliverables{grid-template-columns:1fr 1fr}.m-mentorship-grid{grid-template-columns:1fr}.m-proof{grid-template-columns:1fr}.m-tiers{grid-template-columns:1fr}.m-compare-table{font-size:11px}.m-compare-table th,.m-compare-table td{padding:10px 8px}.m-roi-grid{grid-template-columns:1fr 1fr}.m-btn-order{min-width:100%}.v-footer-inner{flex-direction:column;text-align:center}.v-final-title{font-size:28px}}
@media(max-width:480px){.m-title{font-size:28px}.m-price{font-size:42px}.m-box-visual{width:230px;height:260px}.m-box-crown{font-size:50px}.m-box-label{font-size:24px}.m-float{display:none}.m-platforms{grid-template-columns:1fr 1fr}.v-stitle{font-size:22px}.v-final-title{font-size:24px}.v-quote-text{font-size:18px}.v-whatsapp{width:50px;height:50px;font-size:24px;bottom:20px;right:20px}.m-particle{display:none}}
